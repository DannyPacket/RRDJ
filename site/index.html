<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rancourt Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a rink-board program. Header band ruled like a rink (blue line, red centre line, blue line),
   then a two-column week view on wide screens, single column on phones. */
:root {
  --ice: #F1F4F7;
  --board: #FFFFFF;
  --ink: #0F1C2B;
  --muted: #586777;
  --line: #D4DCE4;
  --red: #C8102E;
  --blue: #1D4E9E;
  --win: #18794A;
  --loss: #B3261E;
  --chip: #E6ECF2;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ice: #0A1018; --board: #111A25; --ink: #E5ECF2; --muted: #93A0AE; --line: #233142;
    --red: #FF4F60; --blue: #78A6FF; --win: #4CC38A; --loss: #FF7B70; --chip: #1A2533;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ice: #0A1018; --board: #111A25; --ink: #E5ECF2; --muted: #93A0AE; --line: #233142;
  --red: #FF4F60; --blue: #78A6FF; --win: #4CC38A; --loss: #FF7B70; --chip: #1A2533;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ice); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header { background: var(--board); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 28px 20px; display: grid; gap: 14px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(34px, 7vw, 60px); line-height: .95; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.weekline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.weekline .wk { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 4vw, 32px); color: var(--red); text-transform: uppercase; }
.weekline .dates { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.rink { height: 10px; display: grid; grid-template-rows: 3px 1fr 2px 1fr 3px; }
.rink i:nth-child(1), .rink i:nth-child(5) { background: var(--blue); }
.rink i:nth-child(3) { background: var(--red); }

/* Picker */
.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.picker label { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
select { font: 500 14px var(--body); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.weeks { display: flex; flex-wrap: wrap; gap: 6px; }
.weeks button { font: 600 13px var(--mono); min-width: 38px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--board); color: var(--ink); cursor: pointer; }
.weeks button[aria-pressed="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }
.weeks button:hover { border-color: var(--blue); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Body grid */
main .wrap { padding-block: 28px 56px; display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; } }
.cols > div { display: grid; gap: 28px; min-width: 0; }
section { display: grid; gap: 12px; min-width: 0; }
h2 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 10px; }
h2::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--red); flex: none; }
.panel { background: var(--board); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.recap p { margin: 0; max-width: 66ch; }
.recap { display: grid; gap: 12px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mgr { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Matchups */
.games { display: grid; gap: 0; }
.game { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.game:first-child { border-top: 0; padding-top: 0; }
.game .side { display: contents; }
.game .w .mgr { color: var(--ink); }
.game .l { color: var(--muted); }
.game .l .mgr { font-weight: 500; }
.tag { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.tag.hs { background: var(--red); color: var(--board); }

/* Standings */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: left; padding: 0 6px 8px; border-bottom: 2px solid var(--ink); }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
tr.playoff-cut td { border-bottom: 2px solid var(--red); }
.move { font: 600 11px var(--mono); }
.up { color: var(--win); } .down { color: var(--loss); }
.st-W { color: var(--win); } .st-L { color: var(--loss); }
.team { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; background: var(--chip); border: 1px solid var(--line); }
td.rk, td.mvcell, td.r { white-space: nowrap; }
td { height: 48px; }
.standings table { table-layout: fixed; min-width: 520px; }
.whotext { min-width: 0; }
.whotext .mgr { display: block; white-space: nowrap; line-height: 1.25; }
.team { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 860px) { .cols.top { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: stretch; } }
.cols.top > div > section { grid-template-rows: auto 1fr; }
.weekpanel { display: grid; gap: 18px; align-content: start; }
.upnext { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
ul.plain.games-next { gap: 0; }
.games-next li { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.games-next li:first-child { border-top: 0; padding-top: 0; }
.standings tbody tr.row { cursor: pointer; }
.standings tbody tr.row:hover td, .standings tbody tr.row.open td { background: var(--chip); }
.standings tbody tr.row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.standings tr.row.open td { border-bottom-color: transparent; }
.standings tr.detail td { height: auto; padding: 4px 10px 14px; background: var(--chip); }
.mh { display: grid; gap: 0; }
.mh-row { display: grid; grid-template-columns: 3.4em 1.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.mh-row:first-child { border-top: 0; }
.mh-res { font: 700 12px var(--mono); }
.games-next .rec { font: 500 12px var(--mono); color: var(--muted); }

/* Stars */
.stars { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.star { position: relative; display: grid; gap: 2px; padding: 12px 92px 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--board); min-height: 104px; align-content: start; }
.star .shot { position: absolute; top: 12px; right: 12px; width: 68px; height: 68px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line); overflow: visible; }
.star .shot .face { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; object-position: top; display: block; }
.star .shot .badge { position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; border-radius: 50%; background: var(--board); border: 1px solid var(--line); display: grid; place-items: center; }
.star .shot.none .badge { right: 19px; bottom: 19px; }
.tlogo { width: 24px; height: 24px; }
.tl-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tl-light { display: none; } :root:not([data-theme="light"]) .tl-dark { display: inline; } }
:root[data-theme="dark"] .tl-light { display: none; } :root[data-theme="dark"] .tl-dark { display: inline; }
.star .pos { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.star .pts { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; }
.star.hi .pts { color: var(--win); } .star.lo .pts { color: var(--loss); }
.star .tag.note { justify-self: start; margin: 4px 0 0; text-transform: none; letter-spacing: 0; font-weight: 500; }
.fa-note { display: grid; gap: 1px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; line-height: 1.35; }
.fa-label { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.subhead { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

/* Lists */
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.streak { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.streak .len { font-family: var(--display); font-weight: 800; font-size: 20px; min-width: 92px; }
.emo { font-size: 18px; }
.trade { display: grid; gap: 6px; }
.trade .row { display: flex; flex-wrap: wrap; gap: 4px 8px; }
ul.plain.moves { gap: 0; }
.moves li { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.moves li:first-child { border-top: 0; padding-top: 2px; }
.mvlist { display: grid; gap: 8px; min-width: 0; }
.add { color: var(--win); font-weight: 600; } .drop { color: var(--loss); }
.empty { color: var(--muted); font-style: italic; }
.tally li { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; align-items: baseline; }
.tally .cnt { font-family: var(--display); font-weight: 900; font-size: 24px; color: var(--red); line-height: 1; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; align-items: stretch; }
.pair > section { grid-template-rows: auto 1fr; }
.tt { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.subhead + .tt { border-top: 0; padding-top: 0; }
.tt-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.tt-side { display: grid; gap: 6px; align-content: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.tt-side.lead { border-color: var(--red); }
.tt-side .tag { justify-self: start; margin-left: 0; }
.tt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tt-total { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
.tt-p { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
/* Standings journey (bump chart) */
.journey { position: relative; min-width: 640px; }
.jsvg { display: block; width: 100%; height: auto; overflow: visible; }
.jgrid { stroke: var(--line); stroke-width: 1; }
.jaxis { font: 500 11px var(--mono); fill: var(--muted); }
.jaxis.fin { font-weight: 700; fill: var(--ink); }
.jaxis.fut { opacity: .45; }
.jcut { stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: .8; }
.jline .jpath { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; opacity: .32; }
.jline .jfin { stroke-dasharray: 4 4; }
.jline .jdot { fill: var(--muted); opacity: .32; stroke: var(--board); stroke-width: 2; cursor: pointer; }
.jline .jhit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.jline.hv .jpath { stroke: var(--blue); opacity: 1; stroke-width: 2.5; }
.jline.hv .jdot { fill: var(--blue); opacity: 1; }
.jline.on .jpath { stroke: var(--red); opacity: 1; stroke-width: 3; }
.jline.on .jdot { fill: var(--red); opacity: 1; r: 5; }
.jlab { font: 500 13px var(--body); fill: var(--muted); cursor: pointer; }
.jlab.hv { fill: var(--ink); }
.jlab.on { fill: var(--ink); font-weight: 700; }
.jlab:focus-visible { outline: 2px solid var(--blue); }
.jtip { position: absolute; pointer-events: none; background: var(--board); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; }
.jtip[hidden] { display: none; }

/* Final-standings podium */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; }
.step { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 18px 14px 0; border-radius: 12px 12px 0 0; border: 1px solid var(--line); border-bottom: 0; background: var(--board); overflow: hidden; }
.step.p1 { border-top: 5px solid var(--red); padding-top: 22px; }
.step .medal { font-size: 34px; line-height: 1; }
.step.p1 .medal { font-size: 46px; }
.logo.pod { width: 64px; height: 64px; }
.step.p1 .logo.pod { width: 88px; height: 88px; }
.pod-name { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase; }
.step.p1 .pod-name { font-size: 44px; }
.step .pos { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pod-dl { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 8px 0 12px; font-size: 13px; text-align: left; }
.pod-dl dt { color: var(--muted); } .pod-dl dd { margin: 0; font-weight: 600; }
.step .block { align-self: end; justify-self: stretch; margin: 0 -14px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; color: var(--board); background: var(--ink); }
.step.p1 .block { height: 96px; font-size: 56px; background: var(--red); }
.step.p2 .block { height: 64px; font-size: 40px; background: var(--blue); }
.step.p3 .block { height: 44px; font-size: 32px; background: var(--muted); }
@media (max-width: 600px) {
  .podium { gap: 8px; }
  .step { padding: 12px 6px 0; }
  .pod-name, .step.p1 .pod-name { font-size: 22px; }
  .pod-dl { grid-template-columns: 1fr; font-size: 12px; text-align: center; }
  .step .block { margin: 0 -6px; }
}

/* Export */
.export-btn { margin-left: auto; font: 600 13px var(--mono); padding: 7px 12px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--board); cursor: pointer; }
.export-btn:disabled { opacity: .6; cursor: progress; }
.export-holder { position: fixed; left: -20000px; top: 0; }
.export-sheet { width: 1200px; background: var(--ice); color: var(--ink); padding: 0 0 24px; }
.export-sheet .export-head { background: var(--board); border-bottom: 1px solid var(--line); padding: 28px 32px 20px; display: grid; gap: 12px; }
.export-sheet .export-title { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: .95; text-transform: uppercase; }
.export-sheet .weekline .wk { white-space: nowrap; }
.export-sheet .export-body { padding: 24px 32px 0; display: grid; gap: 28px; }
.export-sheet .export-foot { padding: 18px 32px 0; font: 500 12px var(--mono); color: var(--muted); display: flex; justify-content: space-between; }
.export-sheet .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.export-sheet .cols.top { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: stretch; }
.export-sheet .tablewrap { overflow: visible; }
.export-sheet .journey { min-width: 0; }
.export-sheet .no-export, .export-sheet .jtip, .export-sheet footer { display: none !important; }
.export-modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.export-card { background: var(--board); color: var(--ink); border-radius: 12px; border: 1px solid var(--line); width: min(720px, 100%); max-height: calc(100vh - 32px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: 16px; }
.export-card h3 { margin: 0; font: 800 20px var(--display); text-transform: uppercase; letter-spacing: .04em; }
.export-preview { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--ice); }
.export-preview img { display: block; width: 100%; height: auto; }
.export-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.export-actions button { font: 600 13px var(--mono); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.export-actions button.primary { background: var(--ink); color: var(--board); border-color: var(--ink); }
.export-status { font-size: 13px; color: var(--muted); margin-left: auto; }

/* Playoff and consolation brackets (Final page) */
.bracket-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
.bracket { display: grid; gap: 6px; min-width: max-content; }
.br-heads { display: flex; gap: var(--br-gap); }
.br-heads > div { width: var(--br-w); font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.br-heads b { display: block; color: var(--ink); font: 800 16px var(--display); letter-spacing: .04em; }
.br-tree { display: grid; gap: 4px; margin-top: 10px; }
.br-label { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.br-tree.br-champ .br-label { color: var(--red); }
.br-area { position: relative; }
.br-area svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.br-area svg path { fill: none; stroke: var(--line); stroke-width: 2; }
.br-area svg path.hot { stroke: var(--red); stroke-width: 3; }
.br-game { position: absolute; width: var(--br-w); background: var(--board); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.br-game.final-game { border: 2px solid var(--red); }
.br-row { display: grid; grid-template-columns: 18px auto minmax(0, 1fr) auto; gap: 7px; align-items: center; height: 30px; padding: 0 9px; }
.br-row + .br-row { border-top: 1px solid var(--line); }
.br-row .seed { font: 600 11px var(--mono); color: var(--muted); text-align: right; }
.br-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.br-row .sc { font: 600 13px var(--mono); color: var(--muted); }
.br-row.won .nm, .br-row.won .sc { font-weight: 700; color: var(--ink); }
.br-row.won { background: color-mix(in srgb, var(--win) 10%, transparent); }
.br-row.lost .nm { color: var(--muted); }
.br-bye { position: absolute; width: var(--br-w); height: 30px; display: grid; grid-template-columns: 18px auto minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 0 9px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; }
.br-bye .seed { font: 600 11px var(--mono); text-align: right; }
.br-bye .tag { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { font: 700 15px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--red); }
.picker[hidden] { display: none; }

/* League history */
.champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.champ { display: grid; gap: 4px; align-content: start; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); border-top: 4px solid var(--red); background: var(--board); }
.champ.live { border-top-color: var(--blue); }
.champ.cancelled { border-top-color: var(--muted); background: repeating-linear-gradient(135deg, var(--chip) 0 10px, var(--board) 10px 20px); }
.champ.cancelled .champ-name { color: var(--muted); }
.cancel-note { font-weight: 600; color: var(--ink); }
.champ-dl.ghost dt { color: var(--muted); opacity: .6; }
.champ-dl.ghost .bar { display: inline-block; width: 64px; height: 10px; border-radius: 5px; background: var(--line); filter: blur(1px); vertical-align: middle; }

      n > 8 ? [sv("line", { class: "jcut", x1: padL, x2: W - padR, y1: (yAt(cut) + yAt(cut + 1)) / 2, y2: (yAt(cut) + yAt(cut + 1)) / 2 })] : null);
    const plot = sv("g");
    svg.append(plot);
    for (const m of mgrs) {
      const pts = cols.map((c, i) => c.by && c.by[m] ? [xAt(i), yAt(c.by[m].rank), c] : null);
      const reg = pts.filter((q, i) => q && !(cols[i].final));
      const d = reg.map((q, i) => (i ? "L" : "M") + q[0] + " " + q[1]).join(" ");
      const fin = cols[last].final && pts[last] && reg.length ? "M" + reg[reg.length - 1][0] + " " + reg[reg.length - 1][1] + " L" + pts[last][0] + " " + pts[last][1] : null;
      const g = sv("g", { class: "jline" },
        sv("path", { class: "jhit", d: d + (fin ? " " + fin.replace("M", "M") : ""), onclick: () => pick(m), onmouseenter: () => paint(m), onmouseleave: () => paint(null) }),
        sv("path", { class: "jpath", d }),
        fin ? sv("path", { class: "jpath jfin", d: fin }) : null,
        pts.map(q => q && sv("circle", { class: "jdot", cx: q[0], cy: q[1], r: 4,
          onmouseenter: e => { paint(m); showTip(e, m, q[2]); }, onmousemove: e => showTip(e, m, q[2]), onmouseleave: () => { paint(null); hideTip(); }, onclick: () => pick(m) })));
      groups[m] = g;
      plot.append(g);
      const endR = pts[last] ? cols[last].by[m].rank : null;
      labels[m] = sv("text", { class: "jlab", x: xAt(last) + 12, y: yAt(endR) + 4, tabindex: "0", role: "button",
        onclick: () => pick(m), onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(m); } },
        onmouseenter: () => paint(m), onmouseleave: () => paint(null) }, m);
      svg.append(labels[m]);
    }
    wrap.append(svg, tip);
    paint(null);
    return sec("Standings journey", panel(h("div", { class: "tablewrap" }, wrap),
      h("div", { class: "muted small", style: "margin-top:8px" }, "Rank after each week" + (w.week === 100 ? ", then the final place after the playoffs (dashed)" : "") + ". Dashed red line = playoff cut (top 8). Click a line or a name to follow a manager.")));
  }

  // Brackets for the Final page. Each place game (a game neither team plays past) is the root of a tree; a team's
  // previous-round game hangs off it only if they won it, so the title game shows the whole winners' path and the
  // 3rd/5th/7th place games show just how those teams got there. A team with no earlier game in the bracket had a bye.
  function bracket(s, w, type) {
    const all = ((w.bracket || {}).games || []).filter(g => g.type === type);
    if (!all.length) return null;
    const last = [...s.weeks].filter(x => x.week !== 100).sort((a, b) => b.week - a.week)[0];
    const seed = last ? Object.fromEntries(last.standings.map(r => [r.mgr, r.rank])) : {};
    const place = Object.fromEntries(w.standings.map(r => [r.mgr, r.rank]));
    const rounds = [...new Set(all.map(g => g.w))].sort((a, b) => a - b);
    const at = {}; all.forEach(g => { (at[g.w] = at[g.w] || {})[g.a] = g; at[g.w][g.b] = g; });
    const winner = g => g.ap > g.bp ? g.a : g.bp > g.ap ? g.b : (place[g.a] || 99) < (place[g.b] || 99) ? g.a : g.b;
    const top = g => (seed[g.a] || 99) <= (seed[g.b] || 99) ? [g.a, g.b] : [g.b, g.a];
    const playsLater = (m, r) => rounds.slice(r + 1).some(x => at[x] && at[x][m]);
    const playedBefore = (m, r) => rounds.slice(0, r).some(x => at[x] && at[x][m]);
    const node = (g, r) => ({ g, r, kids: r === 0 ? [] : top(g).map(m => {
      const prev = at[rounds[r - 1]] && at[rounds[r - 1]][m];
      if (prev) return winner(prev) === m ? node(prev, r - 1) : null;
      return playedBefore(m, r) ? null : { bye: m, r: r - 1 };
    }).filter(Boolean) });
    const roots = all.filter(g => !playsLater(g.a, rounds.indexOf(g.w)) && !playsLater(g.b, rounds.indexOf(g.w)))
      .map(g => ({ t: node(g, rounds.indexOf(g.w)), best: Math.min(place[g.a] || 99, place[g.b] || 99) }))
      .sort((a, b) => a.best - b.best);

    const W = 232, GAP = 52, SLOT = 74, GH = 62, BH = 30;
    const NS = "http://www.w3.org/2000/svg";
    const isFinal = r => type === "Playoffs" && r === rounds.length - 1;
    const roundName = r => type === "Playoffs" ? (["Final", "Semifinals", "Quarterfinals"][rounds.length - 1 - r] || "Round " + (r + 1)) : "Round " + (r + 1);
    const champ = w.standings.find(r => r.rank === 1);
    const row = (m, sc, cls) => h("div", { class: "br-row " + cls },
      h("span", { class: "seed" }, seed[m] || ""),
      avatar(m, s.logos && s.logos[m], 22, "sm"),
      h("span", { class: "nm" }, m),
      h("span", { class: "sc" }, fmt(sc)));
    const drawTree = ({ t, best }) => {
      let leaf = 0;
      const lay = n => {
        if (n.bye || !n.kids.length) { n.y = leaf++ * SLOT; return; }
        n.kids.forEach(lay);
        n.y = n.kids.reduce((a, k) => a + k.y, 0) / n.kids.length;
      };
      lay(t);
      const height = Math.max(leaf, 1) * SLOT - (SLOT - GH);
      const area = h("div", { class: "br-area", style: "height:" + height + "px;width:" + (rounds.length * W + (rounds.length - 1) * GAP) + "px" });
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("aria-hidden", "true");
      const x = r => r * (W + GAP);
      const hotPath = n => n.g && champ && winner(n.g) === champ.mgr;
      const draw = (n, parent) => {
        if (n.bye) {
          area.append(h("div", { class: "br-bye", style: "left:" + x(n.r) + "px;top:" + (n.y + (GH - BH) / 2) + "px" },
            h("span", { class: "seed" }, seed[n.bye] || ""), avatar(n.bye, s.logos && s.logos[n.bye], 22, "sm"), h("span", { class: "nm" }, n.bye), h("span", { class: "tag" }, "Bye")));
        } else {
          const [a, b] = top(n.g), wn = winner(n.g), score = m => m === n.g.a ? n.g.ap : n.g.bp;
          area.append(h("div", { class: "br-game" + (isFinal(n.r) && best === 1 ? " final-game" : ""), style: "left:" + x(n.r) + "px;top:" + n.y + "px", title: "Week " + n.g.w },
            row(a, score(a), a === wn ? "won" : "lost"), row(b, score(b), b === wn ? "won" : "lost")));
          n.kids.forEach(k => draw(k, n));
        }
        if (parent) {
          const y1 = n.y + GH / 2, y2 = parent.y + GH / 2, x1 = x(n.r) + W, x2 = x(parent.r), xm = x1 + GAP / 2;
          const path = document.createElementNS(NS, "path");
          path.setAttribute("d", "M" + x1 + " " + y1 + "H" + xm + "V" + y2 + "H" + x2);
          if (best === 1 && hotPath(n)) path.setAttribute("class", "hot");
          svg.append(path);
        }
      };
      draw(t, null);
      area.prepend(svg);
      const label = best === 1 ? "Championship" : best < 99 ? ord(best) + " place" : "Placement game";
      return h("div", { class: "br-tree" + (best === 1 ? " br-champ" : "") }, h("div", { class: "br-label" }, label + (best === 1 && champ ? " · 🏆 " + champ.mgr : "")), area);
    };
    const heads = h("div", { class: "br-heads" }, rounds.map((wk, r) => h("div", null, h("b", null, roundName(r)), "Week " + wk)));
    const note = type === "Playoffs" ? "Seeds are regular-season finishes. Winners in bold; the red line traces the champion's run." : "The teams that missed the playoffs, playing for 7th place on down.";
    return sec(type === "Playoffs" ? s.label + " playoff bracket" : "Consolation bracket",
      h("div", { class: "bracket-scroll" }, h("div", { class: "bracket", style: "--br-w:" + W + "px;--br-gap:" + GAP + "px" }, heads, roots.map(drawTree))),
      h("div", { class: "muted small" }, note));
  }
  function podium(s, w) {
    const last = [...s.weeks].filter(x => x.week !== 100).sort((a, b) => b.week - a.week)[0];
    const regRank = last ? Object.fromEntries(last.standings.map(r => [r.mgr, r.rank])) : {};
    const top = w.standings.slice().sort((a, b) => a.rank - b.rank).slice(0, 3);
    const tally = Object.fromEntries((w.highScoreTally || []).flatMap(t => t.entries.map(e => [e.mgr, t.count])));
    const label = ["Champion", "Runner-up", "Third place"], medalOf = ["🥇", "🥈", "🥉"];
    const ordn = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
    const step = (r, i) => {
      if (!r) return null;
      const logo = s.logos && s.logos[r.mgr];
      return h("div", { class: "step p" + (i + 1) },
        h("span", { class: "medal", "aria-hidden": "true" }, medalOf[i]),
        logo ? h("img", { class: "logo pod", src: logo, alt: "", width: i ? "64" : "88", height: i ? "64" : "88", onerror: e => e.target.remove() }) : null,
        h("span", { class: "pos" }, label[i]),
        h("span", { class: "pod-name" }, r.mgr),
        s.teams && s.teams[r.mgr] ? h("span", { class: "muted small" }, s.teams[r.mgr]) : null,
        h("dl", { class: "pod-dl" },
          h("dt", null, "Record"), h("dd", { class: "num" }, r.w + "-" + r.l + "-" + (r.t || 0)),
          h("dt", null, "Points for"), h("dd", { class: "num" }, fmt(r.pf)),
          regRank[r.mgr] ? [h("dt", null, "Regular season"), h("dd", { class: "num" }, ordn(regRank[r.mgr]))] : null,
          h("dt", null, "High scores"), h("dd", { class: "num" }, tally[r.mgr] || 0)),
        h("div", { class: "block", "aria-hidden": "true" }, i + 1));
    };
    return sec(s.label + " podium", h("div", { class: "podium" }, step(top[1], 1), step(top[0], 0), step(top[2], 2)));
  }

  // Export: renders the current week (header, write-up, standings, journey, streaks, players, movement) as one PNG
  let exportLib = null;
  const loadExportLib = () => exportLib || (exportLib = new Promise((ok, fail) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js";
    sc.onload = () => window.htmlToImage ? ok(window.htmlToImage) : fail(new Error("no library"));
    sc.onerror = () => { exportLib = null; fail(new Error("library failed to load")); };
    document.head.append(sc);
  }));
  // Google Fonts CSS with every font file inlined, so the image keeps the site's fonts (null if it can't be fetched)
  let fontCSS;
  const loadFontCSS = () => fontCSS || (fontCSS = (async () => {
    try {
      const link = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
      if (!link) return null;
      let css = await fetch(link.href).then(r => r.ok ? r.text() : Promise.reject());
      const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))];
      const toData = u => fetch(u).then(r => r.blob()).then(b => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b); }));
      const datas = await Promise.all(urls.map(toData));
      urls.forEach((u, i) => { css = css.split(u).join(datas[i]); });
      return css;
    } catch (e) { return null; }
  })());
  async function exportWeek() {
    const btn = $("export");
    btn.disabled = true; btn.textContent = "Building…";
    let holder = null;
    try {
      const lib = await loadExportLib();
      const { s, w } = cur;
      const body = $("content").cloneNode(true);
      body.removeAttribute("id");
      body.className = "export-body";
      body.querySelectorAll("img").forEach(i => i.removeAttribute("loading"));
      const sheet = h("div", { class: "export-sheet" },
        h("div", { class: "export-head" },
          h("div", { class: "eyebrow" }, $("season-eyebrow").textContent),
          h("div", { class: "export-title" }, DATA.league || "Rene Rancourt's Day Job"),
          h("div", { class: "weekline" }, h("span", { class: "wk" }, $("wk").textContent), h("span", { class: "dates" }, $("dates").textContent)),
          h("div", { class: "rink", "aria-hidden": "true" }, h("i"), h("i"), h("i"), h("i"), h("i"))),
        body,
        h("div", { class: "export-foot" }, h("span", null, "Rancourt Weekly"), h("span", null, s.source === "sheet" ? "Rebuilt from the league sheet" : "Scores and stats from Fantrax")));
      holder = h("div", { class: "export-holder", "aria-hidden": "true" }, sheet);
      document.body.append(holder);
      await Promise.all([...sheet.querySelectorAll("img")].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const fonts = await loadFontCSS();
      const opts = { pixelRatio: 2, backgroundColor: getComputedStyle(document.body).backgroundColor, width: 1200 };
      if (fonts) opts.fontEmbedCSS = fonts;
      let blob;
      try { blob = await lib.toBlob(sheet, opts); } catch (e) { blob = null; }
      if (!blob) blob = await lib.toBlob(sheet, Object.assign({ skipFonts: true }, opts));
      if (!blob) throw new Error("empty image");
      showExport(blob, "rrdj-" + s.id + "-" + (w.week === 100 ? "final" : "week-" + w.week) + ".png");
    } catch (e) {
      alert("Couldn't build the image (" + (e && e.message || "unknown error") + "). Try again in a moment.");
    } finally {
      if (holder) holder.remove();
      btn.disabled = false; btn.textContent = "Export image";
    }
  }
  function showExport(blob, filename) {
    const url = URL.createObjectURL(blob);
    const status = h("span", { class: "export-status", role: "status" }, "");
    const close = () => { modal.remove(); URL.revokeObjectURL(url); document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") close(); };
    const copy = async () => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        status.textContent = "Copied. Paste it into Discord.";
      } catch (e) { status.textContent = "Copying isn't allowed here. Use Download instead."; }
    };
    const download = async () => {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
      if (dl) {
        try { await dl.save({ filename, data: blob }); status.textContent = "Saved."; }
        catch (e) { status.textContent = e && e.code === "declined" ? "Download cancelled." : "Download isn't available here."; }
        return;
      }
      const a = h("a", { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
      status.textContent = "Downloaded.";
    };
    const modal = h("div", { class: "export-modal", role: "dialog", "aria-modal": "true", "aria-label": "Export image", onclick: e => { if (e.target === modal) close(); } },
      h("div", { class: "export-card" },
        h("h3", null, "Export image"),
        h("div", { class: "export-preview" }, h("img", { src: url, alt: "Preview of the exported week" })),
        h("div", { class: "export-actions" },
          h("button", { type: "button", class: "primary", onclick: copy }, "Copy image"),
          h("button", { type: "button", onclick: download }, "Download PNG"),
          h("button", { type: "button", onclick: close }, "Close"),
          status)));
    document.body.append(modal);
    document.addEventListener("keydown", onKey);
    modal.querySelector("button.primary").focus();
  }

  function boot(data) {
    $("export").addEventListener("click", exportWeek);
    DATA = data;
    $("league").textContent = data.league || "Fantasy hockey";
    const lastId = data.seasons[data.seasons.length - 1].id;
    $("season").replaceChildren(...data.seasons.slice().reverse().map(s => h("option", { value: s.id },
      s.label + (s.id === lastId ? " (in progress)" : s.weeks.some(w => w.week === 100) ? "" : " (no playoffs)"))));
    $("season").addEventListener("change", e => pick(e.target.value, null, true));
    $("tab-week").addEventListener("click", () => pick(cur.s ? cur.s.id : null, cur.w ? cur.w.week : null, true));
    $("tab-history").addEventListener("click", () => showHistory(true, "history"));
    $("tab-seasons").addEventListener("click", () => showHistory(true, "seasons"));
    $("tab-manager").addEventListener("click", () => showHistory(true, "manager"));
    const route = () => {
      const v = (location.hash || "").match(/^#(history|seasons|manager)(?:-(.+))?$/);
      if (v) return showHistory(false, v[1], v[2] && decodeURIComponent(v[2]));
      const x = readHash(); pick(x ? x.s : null, x ? x.w : null, false);
    };
    route();
    window.addEventListener("hashchange", route);
  }

  fetch("reports.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(boot)
    .catch(() => { $("status").textContent = "The weekly report couldn't load. Refresh the page to try again."; });
})();
</script>

</body>
</html>
